name: Create Obsidian plugin release

on:
    workflow_dispatch:
        inputs:
            version:
                description: "Exact manifest version, without a v prefix"
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Check out main
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: main
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Audit production dependency surface
              run: npm audit --omit=dev --audit-level=moderate

            - name: Validate requested version
              env:
                  REQUESTED_VERSION: ${{ inputs.version }}
              run: |
                  node -e "
                    const fs = require('fs');
                    const requested = process.env.REQUESTED_VERSION;
                    const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
                    if (!/^\d+\.\d+\.\d+$/.test(requested)) {
                      throw new Error('Version must be numeric semantic version without a v prefix.');
                    }
                    if (requested !== manifest.version) {
                      throw new Error('Requested version must exactly match manifest.json.');
                    }
                  "

            - name: Run tests
              run: npm test -- --runInBand

            - name: Run lint
              run: npm run lint

            - name: Check formatting
              run: npm run check-format

            - name: Build release assets
              run: npm run build

            - name: Validate release metadata and assets
              run: npm run validate-release

            - name: Package optional archive
              env:
                  VERSION: ${{ inputs.version }}
              run: zip -j "video2knowledge-companion-${VERSION}.zip" main.js manifest.json styles.css

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ inputs.version }}
              run: |
                  gh release create "$VERSION" \
                    main.js \
                    manifest.json \
                    styles.css \
                    "video2knowledge-companion-${VERSION}.zip" \
                    --target "$GITHUB_SHA" \
                    --title "$VERSION" \
                    --generate-notes
